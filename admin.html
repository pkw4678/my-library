<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Library | 관리자</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;color:#253049;background:#f2f4fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 5% 0%,#e0e8ff,transparent 45%),radial-gradient(ellipse at 95% 100%,#f7e9f3,transparent 55%),#f2f4fc;font-size:13px}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #adb6f8;outline-offset:2px}.wrap{max-width:1040px;margin:0 auto;padding:34px 25px 100px}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}.header h1{font-size:24px;margin:5px 0}.header small{color:#72809a}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button,.button{border:1px solid #dce0f0;padding:10px 14px;color:#4c5a83;border-radius:11px;background:#ffffffb0;text-decoration:none;font-weight:700}.button.primary{background:#626dd5;color:white;border-color:#626dd5}.button.danger{color:#bb5269;border-color:#eccbd4}.panel{background:#ffffffc9;backdrop-filter:blur(25px);border:1px solid white;box-shadow:0 10px 30px #53698d12;border-radius:20px;padding:22px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.stat{padding:18px;border-radius:12px;background:#f5f6fd}.stat strong{display:block;font-size:25px}.stat span{font-size:11px;color:#7d89a1}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.filters button{border:1px solid #d5dbed;border-radius:999px;padding:8px 13px;background:white;color:#67748d}.filters button.active{background:#e4e7ff;color:#495bc3;border-color:#bfc8f6}.member{display:flex;gap:15px;align-items:center;justify-content:space-between;padding:17px 3px;border-bottom:1px solid #e7eaf3}.member:last-child{border:0}.member-title{font-weight:760;font-size:14px;overflow-wrap:anywhere}.sub{font-size:11px;color:#79859a;line-height:1.75;margin:4px 0}.tag{font-size:10px;padding:5px 8px;border-radius:999px;background:#edf0fb;color:#5f6982;display:inline-block}.tag.approved{background:#e5f4ea;color:#277853}.tag.rejected,.tag.suspended{background:#fff0f2;color:#ae4c5c}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.actions .button{font-size:11px;padding:8px 10px}.login{max-width:410px;margin:16vh auto}.login h2{font-size:22px}.login label{display:block;font-weight:650;margin:15px 0}.login input{display:block;width:100%;padding:12px;border:1px solid #d3d9ed;border-radius:10px;margin-top:7px}.login .button{width:100%}.message{color:#b14c5a;min-height:22px;font-size:12px;margin-top:12px}.help{font-size:11px;color:#73809b;line-height:1.6}.empty{padding:24px 12px;text-align:center;color:#808ba1}@media(max-width:640px){.wrap{padding:20px 14px 70px}.header{align-items:flex-start}.header h1{font-size:20px}.panel{padding:15px}.member{flex-direction:column;align-items:stretch}.actions{justify-content:flex-start}.stats{gap:7px}.stat{padding:13px}.stat strong{font-size:21px}}
</style>
</head>
<body><div id="adminApp" class="wrap"><div class="panel login"><h2>관리자 페이지</h2><p class="help">Firebase 초기화 중입니다.</p></div></div>
<script type="module" src="./admin.js"></script>
</body>
</html>
