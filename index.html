    /* My Library: translucent desktop surfaces inspired by modern Apple UI. */
    :root{--bg:#edf2fc;--ink:#222b42;--muted:#738198;--line:rgba(139,158,198,.22);--accent:#5b69d8;--accent-dark:#4355b4;--accent-light:rgba(103,114,223,.13);--radius:20px;--shadow:0 12px 34px rgba(55,82,134,.065);--glass-opacity:.649;--glass-heavy:.81;--sidebar:238px}
    body{background:#eaf1fb;isolation:isolate}
    body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 56% 49% at 14% 12%,rgba(181,200,255,.88),transparent 79%),radial-gradient(ellipse 52% 62% at 93% 9%,rgba(255,215,233,.73),transparent 73%),radial-gradient(ellipse 48% 60% at 72% 93%,rgba(175,229,243,.73),transparent 76%),linear-gradient(120deg,#f2f6ff,#fff8fb 62%,#eef9ff)}
    .sidebar,.panel,.modal,.mobile-top{background:rgba(255,255,255,var(--glass-opacity));-webkit-backdrop-filter:blur(27px) saturate(165%);backdrop-filter:blur(27px) saturate(165%);border-color:rgba(255,255,255,.66);box-shadow:0 9px 38px rgba(48,79,131,.075),inset 0 1px 0 rgba(255,255,255,.8)}
    .sidebar{border-right:1px solid rgba(255,255,255,.75);box-shadow:5px 0 35px rgba(52,80,138,.055),inset -1px 0 0 rgba(255,255,255,.5);transition:width .22s ease,padding .22s ease}
    .panel{box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.75)}
    .hero{background:linear-gradient(112deg,rgba(223,224,255,var(--glass-opacity)),rgba(255,243,236,var(--glass-opacity)));-webkit-backdrop-filter:blur(24px) saturate(155%);backdrop-filter:blur(24px) saturate(155%);border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow);border-radius:21px}
    .btn:not(.primary):not(.danger),.pill,.field,.input,.textarea,.searchbox,.result,.media-card,.xbtn,.sidebar-toggle{background:rgba(255,255,255,var(--glass-heavy));border-color:rgba(180,194,223,.45);-webkit-backdrop-filter:blur(15px) saturate(155%);backdrop-filter:blur(15px) saturate(155%)}
    .media-card{box-shadow:0 9px 24px rgba(45,68,114,.06);border-radius:17px}
    .btn.primary{box-shadow:0 5px 15px rgba(82,98,204,.18)}
    .nav-btn{border:1px solid transparent;transition:background .18s ease,color .18s ease}
    .nav-btn:hover{background:rgba(255,255,255,.38)}
    .nav-btn.active{background:rgba(211,219,255,.46);border-color:rgba(255,255,255,.52);color:#4254af}
    .nav-btn .count{background:rgba(255,255,255,.47)}
    .modal{background:rgba(248,250,255,var(--glass-heavy));border:1px solid rgba(255,255,255,.7)}
    .modal-backdrop{background:rgba(22,30,56,.35);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px)}
    .local-pill{background:rgba(246,255,251,.47);border-color:rgba(255,255,255,.7)}
    .notice{background:rgba(238,239,255,.53);border-color:rgba(213,215,250,.65)}
    .brand{gap:8px;padding:1px 4px 25px}
    .brand-info{min-width:0;flex:1}
    .brand strong{font:750 15px/1.2 -apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR','Segoe UI',sans-serif;white-space:nowrap}
    .brand small{font-size:9px;letter-spacing:.055em;white-space:nowrap}
    .logo{flex:none;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(201,213,255,.62));color:#5b65c0;border:1px solid rgba(255,255,255,.72);font:800 19px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .sidebar-toggle{display:grid;place-items:center;flex:none;height:30px;width:30px;border-radius:9px;padding:0;color:#65718a;border:1px solid rgba(180,194,223,.45);cursor:pointer}
    .sidebar-toggle svg{height:17px;width:17px}
    .sidebar-toggle:hover{background:rgba(222,227,255,.9)}

async function lookupAlternativeCovers(item){

  const id=autoCoverQueue.shift(),item=state.items.find(x=>x.id===id);
  if(!item||item.cover)continue;

   }

 try{await persistItem(next);state.metaReview=null;state.modal='detail';openModal('작품 상세 정보');state.detailId=next.id;renderDetail();render();toast('선택한 작품 정보를 갱신했어요.','good')}
 catch(e){console.error(e);toast('작품 정보를 저장하지 못했어요.','warn')}
}

function miniCard(item){return `<div class="mini-card" role="button" tabindex="0" data-action="detail" data-id="${E(item.id)}">${poster(item,'mini-cover',true)}${favoriteButton(item,'mini-favorite')}<h4>${E(item.title)}</h4><p><span>${E(CATS[item.category]?.label||'기타')}</span><span class="mini-status-separator"> · </span>${quickStatusButton(item,'mini-quick-status')}</p></div>`}
function monthlySeries(){const now=new Date();const months=[];for(let i=11;i>=0;i--){let t=new Date(now.getFullYear(),now.getMonth()-i,1);let key=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0');months.push({key,label:(t.getMonth()+1)+'월',count:state.items.filter(x=>x.completedAt?.startsWith(key)).length})}return months}
function monthlyChart(){const series=monthlySeries();const max=Math.max(3,...series.map(x=>x.count));return `<div class="bars">${series.map((x,i)=>`<div class="monthbar" title="${x.key}: ${x.count}개 완료"><div class="bar ${i===11?'strong':''}" style="height:${Math.max(4,x.count/max*98)}px"></div><span>${x.label}</span></div>`).join('')}</div>`}
function categoryBars(){const n=total('all');const xs=Object.entries(CATS).filter(([key])=>total(key)>0).sort((a,b)=>total(b[0])-total(a[0]));return xs.length?xs.map(([id,c])=>`<div><div class="bar-label"><span>${E(c.label)}</span><span>${total(id)}개 · ${Math.round(total(id)/n*100)}%</span></div><div class="bar-track"><div class="bar-fill" style="background:${c.color};width:${total(id)/n*100}%"></div></div></div>`).join(''):'<p class="empty-inline">작품을 등록하면 카테고리별 분포가 표시됩니다.</p>'}
function dashboard(){const done=state.items.filter(x=>x.status==='done').length,active=state.items.filter(x=>x.status==='active').length, ratings=state.items.filter(x=>Number(x.rating)>0),average=ratings.length?(ratings.reduce((s,x)=>s+Number(x.rating),0)/ratings.length).toFixed(1):'—';const recent=[...state.items].sort((a,b)=>(b.createdAt||b.updatedAt||'').localeCompare(a.createdAt||a.updatedAt||'')).slice(0,5);return `<div class="hero"><div><div class="eyebrow">YOUR OWN ARCHIVE</div><h2>좋아했던 순간들을 모아두는 공간</h2><p class="hero-summary"><span class="hero-copy-long">게임에서 영화, 애니메이션, 도서까지. 작품을 검색하고 표지를 불러온 뒤 나만의 감상과 평점을 남겨보세요.</span><span class="hero-copy-compact">게임, 영화, 애니메이션, 도서를 검색하고 감상과 평점을 남겨보세요.</span><span class="hero-copy-mobile">작품을 모으고 나만의 감상과 평점을 기록하세요.</span></p><button class="btn primary small" data-action="add">${ic('plus')} 작품 등록하기</button></div><div class="hero-art">✳</div></div><div class="stats">${statCard('전체 작품',total('all'),'내 라이브러리의 모든 작품','library')}${statCard('완료한 작품',done,'감상 또는 플레이 완료','check')}${statCard('진행 중',active,'현재 즐기고 있는 콘텐츠','clock')}${statCard('내 평균 평점',average,ratings.length+'개 작품 평가','star')}</div><div class="dash-grid"><section class="panel pad"><div class="panel-head"><h2>최근 등록한 작품</h2><a data-action="nav" data-view="library" data-cat="all">전체 보기 ${ic('arrow',12)}</a></div>${recent.length?`<div class="poster-row">${recent.map(miniCard).join('')}</div>`:emptyBox('아직 등록된 작품이 없어요','첫 작품을 추가하면 이곳에서 최근 기록을 볼 수 있어요.')}</section><section class="panel pad"><div class="panel-head"><h2>카테고리 분포</h2><a data-action="nav" data-view="insights">통계 보기 ${ic('arrow',12)}</a></div><div class="category-distro">${categoryBars()}</div></section><section class="panel pad spanall"><div class="panel-head"><h2>최근 12개월 완료 기록</h2><span class="eyebrow">COMPLETED CONTENT</span></div>${monthlyChart()}</section></div>`}
function filtered(){return state.items.filter(x=>(state.category==='all'||x.category===state.category)&&(state.status==='all'||x.status===state.status)&&(!state.favoritesOnly||x.favorite===true)&&(!state.query||[x.title,x.originalTitle,x.creator,x.genre,x.note,x.tags].some(t=>normalizeWorkTitle(t).includes(normalizeWorkTitle(state.query))))).sort((a,b)=>{if(state.sort==='rating')return (Number(b.rating)||-1)-(Number(a.rating)||-1);if(state.sort==='title')return a.title.localeCompare(b.title,'ko');if(state.sort==='year')return (Number(b.year)||0)-(Number(a.year)||0);return (b.updatedAt||'').localeCompare(a.updatedAt||'')})}
function mediaCard(x){const cat=CATS[x.category]||CATS.book;return `<article class="media-card" role="button" tabindex="0" data-action="detail" data-id="${E(x.id)}">${poster(x,'cover',true)}${favoriteButton(x,'card-favorite')}<div class="card-info"><div><h3 title="${E(x.title)}">${E(x.title)}</h3><div class="meta"><span class="category-dot" style="background:${cat.color}"></span>${E(cat.label)}${x.year?' · '+E(x.year):''}</div></div><div class="card-bottom"><span class="rating">${x.rating>0?'★ '+Number(x.rating).toFixed(1):'☆ 미평가'}</span>${quickStatusButton(x,'card-status')}</div></div></article>`}
function library(){const items=filtered();return `<div class="pillrow">${['all',...Object.keys(CATS)].map(c=>`<button class="pill ${state.category===c?'active':''}" data-action="filter-cat" data-cat="${c}">${c==='all'?'전체':CATS[c].label}<span class="n">${total(c)}</span></button>`).join('')}</div><div class="toolbar"><div class="toolbar-left"><label class="searchbox">${ic('search')}<input type="search" id="localSearch" placeholder="내 작품 검색" value="${E(state.query)}" autocomplete="off"></label><select class="field" id="statusFilter" aria-label="상태 필터"><option value="all">모든 상태</option>${Object.entries(STATUSES).map(([id,label])=>`<option value="${id}" ${state.status===id?'selected':''}>${label}</option>`).join('')}</select></div><div class="toolbar-right"><button type="button" class="btn favorite-filter ${state.favoritesOnly?'active':''}" data-action="favorite-filter" aria-pressed="${state.favoritesOnly}">${ic('heart',15)} 즐겨찾기 ${state.items.filter(x=>x.favorite===true&&(state.category==='all'||state.category===x.category)).length}</button><select class="field" id="sortFilter" aria-label="정렬"><option value="new" ${state.sort==='new'?'selected':''}>최근 수정순</option><option value="rating" ${state.sort==='rating'?'selected':''}>평점 높은순</option><option value="title" ${state.sort==='title'?'selected':''}>이름순</option><option value="year" ${state.sort==='year'?'selected':''}>출시연도순</option></select><button class="btn icononly ${state.layout==='grid'?'primary':''}" data-action="layout" data-layout="grid" title="그리드 보기">${ic('grid')}</button><button class="btn icononly ${state.layout==='list'?'primary':''}" data-action="layout" data-layout="list" title="목록 보기">${ic('list')}</button></div></div><div class="library-results" id="libraryResults">${libraryResultsMarkup(items)}</div>`}
function libraryResultsMarkup(items){return items.length?`<div class="media-grid ${state.layout==='list'?'listmode':''}" id="mediaItems">${items.map(mediaCard).join('')}</div><p class="section-caption" id="resultCaption" aria-live="polite">총 ${items.length}개 작품 표시</p>`:emptyBox(total('all')?'조건에 맞는 작품이 없어요':'아직 저장된 작품이 없어요',total('all')?'검색어와 필터를 바꿔보세요.':'상단 작품 추가 버튼으로 외부 DB에서 작품을 검색해 보세요.',total('all')===0)}
function updateLibraryResults(){const area=$('#libraryResults');if(area)area.innerHTML=libraryResultsMarkup(filtered())}
function insight(){const rated=state.items.filter(x=>x.rating>0);const done=state.items.filter(x=>x.status==='done');const top=[...rated].sort((a,b)=>b.rating-a.rating).slice(0,8);const labels=Object.entries(STATUSES).map(([k,name])=>({k,name,count:state.items.filter(x=>x.status===k).length}));return `<div class="insight-top">${statCard('평가한 작품',rated.length+'개','평점을 남긴 작품','star')}${statCard('완료율',total('all')?Math.round(done.length/total('all')*100)+'%':'—','전체 등록 작품 대비','check')}${statCard('관심 목록',state.items.filter(x=>x.status==='wish').length+'개','앞으로 즐길 콘텐츠','clock')}</div><div class="insight-grid"><section class="panel pad"><div class="panel-head"><h2>콘텐츠 유형</h2></div><div class="category-distro">${categoryBars()}</div></section><section class="panel pad"><div class="panel-head"><h2>진행 상태</h2></div><div class="category-distro">${labels.map(x=>`<div><div class="bar-label"><span>${statusLabel(x.k)}</span><span>${x.count}개</span></div><div class="bar-track"><div class="bar-fill" style="background:#b4a4e5;width:${total('all')?x.count/total('all')*100:0}%"></div></div></div>`).join('')}</div></section><section class="panel pad"><div class="panel-head"><h2>월별 완료 기록</h2></div>${monthlyChart()}</section><section class="panel pad"><div class="panel-head"><h2>내가 높게 평가한 작품</h2></div>${top.length?`<div class="toplist">${top.map((x,i)=>`<div class="topline"><span class="topnum">${String(i+1).padStart(2,'0')}</span><span class="name">${E(x.title)}</span><span class="rating">★ ${Number(x.rating).toFixed(1)}</span></div>`).join('')}</div>`:'<p class="empty-inline">평점을 등록하면 여기에 순위가 표시됩니다.</p>'}</section></div>`}
function settings(){return `<div class="settings-grid"><section class="panel setting-block"><h3>화면 · 리퀴드 글라스</h3><p>패널과 Dock의 투명도를 조절할 수 있어요. 변경 사항은 이 브라우저에 자동 저장됩니다.</p><label for="glassSlider" style="font-size:11px;font-weight:800;color:#666c7f">유리 투명도</label><div class="glass-control"><input type="range" id="glassSlider" min="0" max="100" step="1" value="${state.glassTransparency}" aria-label="유리 투명도"><output id="glassValue" for="glassSlider">${state.glassTransparency}%</output></div><div class="glass-scale"><span>0% · 불투명</span><span>100% · 가장 투명</span></div><div class="glass-preview"><div class="glass-preview-card">My Library · Glass Preview</div></div></section><section class="panel setting-block"><h3>데이터 백업</h3><p>모든 작품, 평가, 감상평을 JSON 파일로 내보내요. 브라우저 데이터를 지우거나 파일을 이동하기 전에 백업해 두세요.</p><div class="stack"><button class="btn primary" data-action="export">${ic('download')} JSON 백업 다운로드</button><button class="btn" data-action="import">${ic('upload')} 백업 가져오기</button></div><input type="file" id="importFile" accept="application/json,.json" class="hidden"><div class="cloud-tip">마지막 등록 작품 수: ${total('all')}개 / 저장 방식: ${state.dbMode==='indexeddb'?'IndexedDB':'LocalStorage'}</div></section><section class="panel setting-block"><h3>영화 정보 검색 강화 (선택)</h3><p>기본 검색은 무료 공개 DB로 작동해요. TMDB API 키를 추가하면 영화와 드라마의 공식 포스터와 한국어 정보를 더 쉽게 검색할 수 있어요.</p><div class="form-row"><label for="tmdbKeyInput">TMDB v3 API 키</label><input class="input" id="tmdbKeyInput" type="password" value="${E(state.tmdbKey)}" placeholder="선택 입력 · 현재 기기에만 저장" autocomplete="off"><span class="help">이 키는 브라우저에만 저장돼요. 나중에 HTML을 공개 호스팅할 때는 키를 페이지에 포함하지 말고 서버 프록시로 옮겨야 해요.</span></div><div class="stack"><button class="btn" data-action="save-tmdb">API 키 저장</button><button class="btn" data-action="delete-tmdb">키 삭제</button><button class="btn ghost" data-action="open-tmdb">TMDB 키 발급 ${ic('external',13)}</button></div></section><section class="panel setting-block"><h3>게임 이미지 검색 강화 (선택)</h3><p>게임은 RAWG의 전용 데이터베이스를 추가로 검색할 수 있습니다. 개인 비상업 용도로 사용 시 무료 API 키와 출처 표시가 필요합니다. 제공 이미지는 세로형 표지가 아닐 수 있습니다.</p><div class="form-row"><label for="rawgKeyInput">RAWG API 키</label><input class="input" id="rawgKeyInput" type="password" value="${E(state.rawgKey)}" placeholder="선택 입력 · 이 브라우저에만 저장" autocomplete="off"><span class="help">파일 자체에 키가 삽입되지는 않지만 브라우저에서는 API 요청 시 키가 노출될 수 있습니다. 공개 배포 전 서버 측 관리가 필요합니다.</span></div><div class="stack"><button class="btn" data-action="save-rawg">API 키 저장</button><button class="btn" data-action="delete-rawg">키 삭제</button><button class="btn ghost" data-action="open-rawg">RAWG 키 발급 ${ic('external',13)}</button></div></section><section class="panel setting-block"><h3>검색에 사용하는 데이터베이스</h3><p>모두 외부 사이트의 공개 API를 사용해요. 콘텐츠 검색과 표지 로딩에는 인터넷이 필요하고 API 제공처의 제한에 따라 결과가 누락될 수 있어요.</p><div class="category-distro">${Object.entries(CATS).map(([key,c])=>`<div class="bar-label"><span>${c.label}</span><span>${c.src}</span></div>`).join('')}</div></section><section class="panel setting-block"><h3>전체 작품 휴지통 이동</h3><p>현재 등록된 작품을 휴지통으로 이동합니다. 30일 이내 같은 브라우저에서 복원할 수 있으며, 브라우저 데이터 삭제에 대비해 JSON 백업도 보관하세요.</p><button class="btn danger" data-action="clear">${ic('trash')} 전체 작품 휴지통 이동</button></section><section class="panel setting-block" style="grid-column:1/-1"><h3>사용 안내</h3><p style="margin:0">파일을 더블클릭해 브라우저에서 실행할 수 있어요. 같은 브라우저에서 같은 파일 주소로 열어야 기존 기록이 유지돼요. 시크릿 모드, 브라우저 데이터 삭제, 다른 PC에서는 기록이 유지되지 않을 수 있어요. 이미지 주소만 저장하므로 원본 사이트에서 이미지를 삭제하면 표지가 사라질 수 있어요. 정기적으로 JSON 백업을 보관해 주세요.</p></section></div>`}
function render(){makeNavigation();topHeader();const v=$('#view');if(state.view==='dashboard')v.innerHTML=dashboard();else if(state.view==='library')v.innerHTML=library();else if(state.view==='insights')v.innerHTML=insight();else v.innerHTML=settings();observeMissingSavedCovers()}
function openModal(title,subtitle='',small=false){const m=$('#modalBackdrop');m.classList.add('open');m.querySelector('.modal').classList.toggle('smallmodal',small);m.querySelector('.modal').classList.toggle('modal-editor',state.modal==='editor');$('#modalShell').classList.toggle('small-shell',small);$('#modalScrollSurface').scrollTop=0;requestAnimationFrame(updateModalScrollbar);$('#modalTitle').textContent=title;$('#modalSubtitle').textContent=subtitle;$('#modalBody').innerHTML='';$('#modalFoot').innerHTML='';document.body.style.overflow='hidden';setTimeout(()=>{if(!m.classList.contains('open'))return;const active=document.activeElement;if(m.contains(active)&&active?.matches?.('input,textarea,select,[contenteditable]'))return;const field=$('#modalBody input:not([type=hidden])')||$('#modalBody textarea');if(field)field.focus()},90)}

function categoryOptions(selected){return Object.entries(CATS).map(([id,c])=>`<option value="${id}" ${id===selected?'selected':''}>${c.label}</option>`).join('')}
function openAdd(){if(state.view==='library'&&state.category!=='all')state.addCategory=state.category;state.modal='add';state.addTab='search';state.searchCategory='all';state.results=[];state.searchError='';state.searchIssues=[];state.searchExpanded=false;state.lastSearchTerm='';state.searching=false;state.searchEpoch++;openModal('작품 추가','모든 콘텐츠 유형을 한 번에 검색합니다.');renderAdd()}
function renderAdd(){if(state.modal!=='add')return;$('#modalSubtitle').textContent=state.addTab==='search'?'게임·영화·드라마·애니메이션·만화·도서를 통합 검색해요.':'검색되지 않는 작품은 직접 정보를 입력할 수 있어요.';
 $('#modalBody').innerHTML=`<div class="tabs"><button class="tab ${state.addTab==='search'?'active':''}" data-action="add-tab" data-tab="search">전체 콘텐츠 검색</button><button class="tab ${state.addTab==='manual'?'active':''}" data-action="add-tab" data-tab="manual">직접 등록</button></div>${state.addTab==='search'?`<div class="search-hero"><input class="input" id="remoteQuery" placeholder="예: 다이 하드, Die Hard, 진격의 거인" autocomplete="off" maxlength="100"><button class="btn primary" id="remoteSearchBtn" data-action="remote-search" ${state.searching?'disabled':''}>${state.searching?'<span class="loading"></span>검색 중':ic('search')+' 검색'}</button></div><div class="notice" style="margin-bottom:13px">6개 카테고리를 함께 검색합니다. 동명의 게임과 영화는 각각 표시되며, 선택한 결과의 유형과 작품 정보가 자동으로 입력됩니다.${!state.tmdbKey?' 영화 검색은 TMDB 키 등록 시 정확도와 포스터 정보가 개선됩니다.':''}</div><div class="search-results" id="remoteResults">${searchResultMarkup()}</div>`:`<div class="form-row"><label for="addCat">직접 등록할 콘텐츠 유형</label><select class="field" id="addCat">${categoryOptions(state.addCategory)}</select></div><div class="notice">외부 검색에 나타나지 않는 작품은 이곳에서 직접 등록할 수 있습니다.</div><div style="margin-top:18px"><button class="btn primary" data-action="manual-create">${ic('plus')} 직접 등록 화면 열기</button></div>`}`;$('#modalFoot').innerHTML=`<button class="btn" data-action="close-modal">닫기</button>`}

function searchResultMarkup(){
 if(state.searching&&!state.results.length)return `<div class="empty" style="grid-column:1/-1;min-height:155px"><div class="loading"></div><strong>작품을 찾고 있습니다</strong><p>응답이 도착한 검색 결과부터 표시됩니다.</p></div>`;
 if(state.searchError&&!state.results.length)return `<div class="empty" style="grid-column:1/-1;min-height:155px"><strong>${state.searchIssues.length?'검색 서비스 연결이 원활하지 않습니다':'검색 결과가 없습니다'}</strong><p>${E(state.searchError)}</p><div class="search-empty-actions"><button class="btn small" data-action="remote-search">다시 검색</button>${!state.searchExpanded?`<button class="btn small" data-action="expand-search">검색 범위 넓히기</button>`:''}<button class="btn small" data-action="manual-create">직접 등록</button></div></div>`;

async function enrichWikipediaSelection(result,editor){
 try{
  const url=new URL(result.sourceUrl||'');
  if(!/^([a-z]{2,3})\.wikipedia\.org$/.test(url.hostname))return;
  const language=url.hostname.split('.')[0];
  const title=decodeURIComponent(url.pathname.replace(/^\/wiki\//,'')).replace(/_/g,' ');
  if(!title)return;
  const api=new URL(`https://${language}.wikipedia.org/w/api.php`);
  Object.entries({action:'query',titles:title,prop:'extracts|pageimages|categories|langlinks|info',piprop:'thumbnail|original',pithumbsize:'500',pilicense:'any',exintro:'1',explaintext:'1',exchars:'1300',cllimit:'100',lllang:'en',inprop:'url',format:'json',origin:'*'}).forEach(([k,v])=>api.searchParams.set(k,v));
  const data=await fetchJson(api,7000);
  const page=Object.values(data.query?.pages||{})[0];if(!page||page.missing!==undefined)return;
  const filled=wikipediaMetadata({...page,_lang:language},result.category);
  if(!filled.cover){try{const options=await fetchWikiPageCover(language,title,result.category);filled.cover=options[0]||'';filled.coverAlternates=cleanCovers(options,filled.cover)}catch(e){console.warn('위키백과 표지 보강 실패:',e)}}
  if(state.modal!=='editor'||state.editing!==editor)return;
  if(filled.creator&&!editor.creator)editor.creator=filled.creator;
  if(filled.genre&&!editor.genre)editor.genre=filled.genre;
  const fields=[['#editYear','year'],['#editOriginal','originalTitle']];
  for(const [selector,key] of fields){
   const input=$(selector);if(!input||!filled[key])continue;
   const badStoredYear=key==='year'&&isSuspiciousTitleYear(result)&&String(input.value).trim()===String(editor.year).trim();
   if(!input.value.trim()||badStoredYear){input.value=filled[key];editor[key]=filled[key];if(badStoredYear)toast('출시연도를 다시 확인했어요. 저장하면 수정된 연도가 반영됩니다.','good')}
  }
  if(!$('#editCover')?.value.trim()&&filled.cover){$('#editCover').value=filled.cover;editor.cover=filled.cover;$('#previewCover').innerHTML=poster(editor,'detail-cover')}
  editor.coverAlternates=cleanCovers([...(editor.coverAlternates||[]),...(filled.coverAlternates||[])],editor.cover);
 }catch(e){console.warn('Wikipedia 추가 정보 가져오기 실패:',e)}
}

// Glass scroll thumb is outside the scrolling element so it remains stationary while content scrolls.
function updateModalScrollbar(){
 const m=$('#modalScrollSurface'),track=$('#modalScrollbar'),thumb=$('#modalScrollThumb');
 if(!m||!track||!thumb)return;
 const extent=m.scrollHeight-m.clientHeight,usable=Math.max(0,track.clientHeight-4);
 track.classList.toggle('is-active',extent>3);
 if(extent<=3||usable<=0)return;
 const height=Math.max(30,Math.min(usable,usable*m.clientHeight/m.scrollHeight));
 thumb.style.height=height+'px';
 thumb.style.transform='translateY('+(m.scrollTop/extent*Math.max(0,usable-height))+'px)';
}
function initModalScrollbar(){
 const m=$('#modalScrollSurface'),track=$('#modalScrollbar'),thumb=$('#modalScrollThumb');
 m.addEventListener('scroll',updateModalScrollbar,{passive:true});
 window.addEventListener('resize',updateModalScrollbar);
 const observer=new ResizeObserver(()=>requestAnimationFrame(updateModalScrollbar));
 observer.observe(m);observer.observe($('#modalBody'));observer.observe($('#modalFoot'));
 const mutation=new MutationObserver(()=>requestAnimationFrame(updateModalScrollbar));
 mutation.observe($('#modalBody'),{subtree:true,childList:true,characterData:true});
 let drag=null;
 track.addEventListener('pointerdown',event=>{
  if(!track.classList.contains('is-active'))return;
  event.preventDefault();event.stopPropagation();
  if(event.target===thumb){drag={y:event.clientY,scroll:m.scrollTop};thumb.classList.add('dragging');track.setPointerCapture(event.pointerId)}
  else{const r=track.getBoundingClientRect(),pos=event.clientY-r.top-thumb.offsetHeight/2;
   const max=Math.max(1,r.height-4-thumb.offsetHeight);m.scrollTop=Math.max(0,Math.min(1,pos/max))*(m.scrollHeight-m.clientHeight)}
 });
 track.addEventListener('pointermove',event=>{
  if(!drag)return;
  const range=Math.max(1,track.clientHeight-4-thumb.offsetHeight);
  m.scrollTop=drag.scroll+(event.clientY-drag.y)/range*(m.scrollHeight-m.clientHeight);
 });
 const stop=()=>{drag=null;thumb.classList.remove('dragging')};
 track.addEventListener('pointerup',stop);track.addEventListener('pointercancel',stop);
}
initModalScrollbar();

async function searchWikidataFilmTV(term,cat,page=1){

 Object.entries({action:'wbsearchentities',search:term,language:lang,uselang:lang,limit:'15',format:'json',origin:'*'}).forEach(([k,v])=>u.searchParams.set(k,v));
 if(page>1)u.searchParams.set('continue',String((page-1)*15));

}

};
removeItem = async function(id) {if(state.items.some(x=>x.id===id)){await saveSnapshot('삭제 이전');await qualityDelete([id]);}};
clearItems = async function() {if(state.items.length){await saveSnapshot('전체 삭제 이전');await qualityDelete(state.items.map(x=>x.id));}};
qualityRestoreTrash = async function(id) {
 const rec=qualityState.trash.find(x=>x.id===id);
 if(!rec)throw Error('휴지통 항목이 없습니다.');
 if(state.items.some(x=>x.id===id))throw Error('이미 같은 ID의 작품이 있습니다.');
 const restored=normalizeImported(rec.item);
 if(!restored)throw Error('작품 정보가 올바르지 않습니다.');
 cloudSaveBusy=true;
 try{
  await libraryAccount.api.restoreTrash({...rec,item:restored});
  state.items.push(restored);
  qualityState.trash=qualityState.trash.filter(x=>x.id!==id);
 }finally{cloudSaveBusy=false;}
};
qualityWriteTrash = async function(rows) {
 const clean=qualityTrimTrash(rows);
 cloudSaveBusy=true;
 try{await libraryAccount.api.replaceTrash(qualityState.trash,clean);qualityState.trash=clean;}
 finally{cloudSaveBusy=false;}
};
qualityReadTrash = async function(){return qualityState.trash;};
replaceEverything = async function(items,collections,mode='replace') {
 const normalized=items.map(normalizeImported);
 if(normalized.some(x=>!x)||new Set(normalized.map(x=>x.id)).size!==normalized.length)throw Error('작품 데이터 형식 또는 ID 오류');
 const cols=normalizeCollections(collections);
 if(new Set(cols.map(x=>x.id)).size!==cols.length)throw Error('컬렉션 ID 중복');
 const finalItems=mode==='replace'?normalized:[...new Map([...state.items,...normalized].map(x=>[x.id,x])).values()];
 const finalCols=mode==='replace'?cols:[...new Map([...state.collections,...cols].map(x=>[x.id,x])).values()];
 cloudSaveBusy=true;
 try{await libraryAccount.api.replaceAll(finalItems,finalCols);state.items=finalItems;state.collections=finalCols;}
 finally{cloudSaveBusy=false;}
};
saveSnapshot = async function(reason='자동 복구 지점') {
 if(!state.items.length&&!state.collections.length)return;
 const snapshot={id:new Date().toISOString()+'-'+newId().slice(-7),createdAt:new Date().toISOString(),reason,items:cloneCloud(state.items),collections:cloneCloud(state.collections)};
 const next=[snapshot,...state.snapshots].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,5);
 // Browser-scoped only: never mix snapshots across users, and never overwrite cloud data.
 try{localAccountWrite('snapshots',next);state.snapshots=next;}
 catch(e){console.warn('로컬 복구 지점 저장 불가 (JSON 백업 권장)',e);}
 return snapshot;
};
qualityApplyPrefs=function(p){const clean=qualitySanitizePrefs(p);if(!clean)return;
 state.layout=clean.layout;state.sort=clean.sort;state.savedFilters=clean.savedFilters;state.favoritesOnly=clean.favoritesOnly;state.advanced=clean.advanced;state.glassTransparency=clean.glassTransparency;applyAppearance();
 try{localAccountWrite('preferences',clean)}catch(e){console.warn('계정별 환경설정 저장 오류',e)}
};
saveFilter=function(){const name=promptlessFilterName();state.savedFilters=[...state.savedFilters,{id:newId(),name,advanced:{...state.advanced},status:state.status,category:state.category,favoritesOnly:state.favoritesOnly,collectionFilter:state.collectionFilter}].slice(-12);
 try{localAccountWrite('filters',state.savedFilters);render();toast('필터를 저장했습니다.','good')}catch(e){toast('필터 저장 실패','warn')}
};
saveRawg=function(){const key=$('#rawgKeyInput')?.value.trim()||'';if(key.length>200){toast('RAWG 키가 너무 깁니다.','warn');return;}state.rawgKey=key;try{localAccountWrite('rawg-key',key);coverLookupCache.clear();toast('RAWG 키를 저장했습니다.','good')}catch(e){toast('설정 저장 실패','warn')}};
saveTmdb=function(){const key=$('#tmdbKeyInput')?.value.trim()||'';if(key&&!/^[a-zA-Z0-9]{24,80}$/.test(key)){toast('TMDB API 키 형식을 확인하세요.','warn');return;}state.tmdbKey=key;try{localAccountWrite('tmdb-key',key);toast('TMDB 키를 저장했습니다.','good')}catch(e){toast('설정 저장 실패','warn')}};
const cloudSettingsBase=settings;
settings=function(){return `<section class="panel setting-block" style="margin-bottom:18px"><h3>클라우드 계정</h3><p>작품, 컬렉션 및 휴지통은 회원 계정별로 Firestore에 저장됩니다. 복구 지점과 임시 초안은 현재 브라우저에만 보관됩니다.</p><div class="stack"><button class="btn" type="button" id="cloudReloadNow">서버에서 새로고침</button><button class="btn" type="button" id="cloudLogoutNow">로그아웃</button></div></section>`+cloudSettingsBase()};
document.addEventListener('click',async e=>{
 if(e.target.closest('#accountLogout,#cloudLogoutNow')){e.preventDefault();e.stopImmediatePropagation();if(state.modal==='editor'&&editorChanged())saveDraftNow();
  if(confirm('로그아웃할까요? 작성 중인 내용은 계정별 임시 저장소에 남습니다.'))window.LibraryBridge.logout?.();
  return;}
 if(e.target.closest('#cloudReloadNow')){e.preventDefault();e.stopImmediatePropagation();await window.LibraryBridge.reload?.();}
},true);
window.LibraryBridge={
 busy(){return cloudSaveBusy||!!state.modal;},
 start:async function({uid,email,role,nickname,api,data}){
  libraryAccount={uid,email,role,nickname,api};
  state.dbMode='cloud';state.items=Array.isArray(data.items)?data.items:[];
  state.collections=normalizeCollections(data.collections);qualityState.trash=qualityTrimTrash(data.trash||[]);
  state.snapshots=localAccountRead('snapshots',[]);
  state.savedFilters=localAccountRead('filters',[]);
  state.rawgKey=localAccountRead('rawg-key','');state.tmdbKey=localAccountRead('tmdb-key','');
  const prefs=localAccountRead('preferences',null);if(prefs)qualityApplyPrefs(prefs);
  EDITOR_DRAFT_KEY=accountKey('draft');memoryEditorDraft=null;
  const bar=$('#accountBar');
  bar.innerHTML=`<span class="account-user" title="${E(email)}">${E(nickname||email)}</span>${role==='admin'?'<a class="account-link" href="./admin.html">관리자</a>':''}<button class="account-signout" id="accountLogout" type="button">로그아웃</button>`;
  render();
 },
 refresh:async function(data){
  if(!libraryAccount||cloudSaveBusy||state.modal)return;
  state.items=Array.isArray(data.items)?data.items:[];
  state.collections=normalizeCollections(data.collections);
  qualityState.trash=qualityTrimTrash(data.trash||[]);
  render();
  toast('서버의 최신 데이터를 불러왔습니다.','good');
 },
 reload:async function(){
  if(!libraryAccount||state.modal){toast('편집 화면을 먼저 닫아주세요.','warn');return;}
  try{const data=await libraryAccount.api.load();await window.LibraryBridge.refresh(data)}
  catch(e){toast('서버 새로고침 실패: '+e.message,'warn');}
 },
 logout:()=>{document.dispatchEvent(new CustomEvent('my-library-signout'));}
};

</script>
</body>
</html>
